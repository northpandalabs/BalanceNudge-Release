name: Auto Release

on:
  push:
    branches: [ main ]

# Cancel any in-progress run for the same branch so rapid commits don't race
# to create or edit the same release tag simultaneously.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release stage and assets
        id: resolve
        shell: bash
        run: |
          # Priority: Release > Beta > Alpha -- first folder that exists with a versioned build wins
          STAGE=""
          ASSET_DIR=""
          BUILD=""

          for CANDIDATE in Release Beta Alpha; do
            if [ -d "$CANDIDATE" ]; then
              HIGHEST=$(find "$CANDIDATE" -maxdepth 1 -mindepth 1 -type d 2>/dev/null \
                | sort -V | tail -1)
              if [ -n "$HIGHEST" ]; then
                STAGE=$(echo "$CANDIDATE" | tr '[:upper:]' '[:lower:]')
                ASSET_DIR="$HIGHEST"
                BUILD=$(basename "$HIGHEST")
                break
              fi
            fi
          done

          if [ -z "$STAGE" ]; then
            echo "ERROR: No release stage folder (Alpha/Beta/Release) with a build subfolder found."
            exit 1
          fi

          # desc.txt in the build folder overrides release.json description when present
          if [ -f "$ASSET_DIR/desc.txt" ]; then
            cp "$ASSET_DIR/desc.txt" "$RUNNER_TEMP/effective_desc.txt"
            echo "has_desc_txt=true" >> "$GITHUB_OUTPUT"
            echo "desc.txt found -- will update description in release.json"
          else
            jq -r '.description' release.json > "$RUNNER_TEMP/effective_desc.txt"
            echo "has_desc_txt=false" >> "$GITHUB_OUTPUT"
            echo "No desc.txt -- description left unchanged"
          fi

          echo "stage=$STAGE"         >> "$GITHUB_OUTPUT"
          echo "asset_dir=$ASSET_DIR" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD"         >> "$GITHUB_OUTPUT"
          echo "tag=v$BUILD"          >> "$GITHUB_OUTPUT"

          echo "Resolved: stage=$STAGE  build=$BUILD  assets=$ASSET_DIR"

      - name: Build release notes
        shell: bash
        env:
          STAGE: ${{ steps.resolve.outputs.stage }}
          BUILD: ${{ steps.resolve.outputs.build }}
        run: |
          DESCRIPTION=$(cat "$RUNNER_TEMP/effective_desc.txt")
          {
            echo "**Stage:** $STAGE"
            echo "**Version:** $BUILD"
            echo ""
            echo "$DESCRIPTION"
          } > "$RUNNER_TEMP/release_notes.txt"

      - name: Create or update GitHub release
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          STAGE: ${{ steps.resolve.outputs.stage }}
          BUILD: ${{ steps.resolve.outputs.build }}
          ASSET_DIR: ${{ steps.resolve.outputs.asset_dir }}
        run: |
          TITLE="BalanceNudge $BUILD ($STAGE)"

          # Exclude desc.txt from uploaded assets -- it is metadata, not a download
          mapfile -t ASSETS < <(find "$ASSET_DIR" -maxdepth 1 -type f ! -name "desc.txt")

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "WARNING: No asset files found in $ASSET_DIR -- release will have no attachments."
          fi

          PRERELEASE_FLAGS=("--prerelease")
          if [ "$STAGE" = "release" ]; then
            PRERELEASE_FLAGS=("--no-prerelease")
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Tag $TAG exists -- updating release and re-uploading assets."
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release_notes.txt" \
              "${PRERELEASE_FLAGS[@]}"

            if [ ${#ASSETS[@]} -gt 0 ]; then
              gh release upload "$TAG" "${ASSETS[@]}" --clobber
            fi
          else
            echo "Creating new release $TAG."
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release_notes.txt" \
              "${PRERELEASE_FLAGS[@]}" \
              "${ASSETS[@]}"
          fi

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "Release URL: $RELEASE_URL"

      - name: Update release.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_URL: ${{ steps.publish.outputs.release_url }}
          BUILD: ${{ steps.resolve.outputs.build }}
          TAG: ${{ steps.resolve.outputs.tag }}
          ASSET_DIR: ${{ steps.resolve.outputs.asset_dir }}
          HAS_DESC_TXT: ${{ steps.resolve.outputs.has_desc_txt }}
          REPO: ${{ github.repository }}
        run: |
          # Always update version and release_page
          UPDATED=$(jq \
            --arg ver "$BUILD" \
            --arg url "$RELEASE_URL" \
            '.version = $ver | .release_page = $url' \
            release.json)

          # Update description only when desc.txt was present -- never touch it otherwise
          if [ "$HAS_DESC_TXT" = "true" ]; then
            DESC=$(cat "$RUNNER_TEMP/effective_desc.txt")
            UPDATED=$(echo "$UPDATED" | jq --arg d "$DESC" '.description = $d')
          fi

          # Add or update download URLs only for platform files that actually exist in the build folder.
          # Files not present are left alone -- unknown fields in release.json are never touched.
          declare -A EXT_MAP=([exe]=download_win [dmg]=download_mac [deb]=download_linux)
          for EXT in "${!EXT_MAP[@]}"; do
            FILE=$(find "$ASSET_DIR" -maxdepth 1 -name "*.$EXT" | head -1)
            if [ -n "$FILE" ]; then
              FNAME=$(basename "$FILE")
              DL_URL="https://github.com/$REPO/releases/download/$TAG/$FNAME"
              KEY="${EXT_MAP[$EXT]}"
              UPDATED=$(echo "$UPDATED" | jq --arg k "$KEY" --arg v "$DL_URL" '.[$k] = $v')
              echo "Set $KEY -> $DL_URL"
            fi
          done

          echo "$UPDATED" > release.json

          # Only commit when something actually changed
          if git diff --quiet -- release.json; then
            echo "release.json unchanged, nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release.json
          git commit -m "chore: update release.json for $TAG [skip ci]"
          git push
