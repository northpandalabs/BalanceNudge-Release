name: Auto Release

on:
  push:
    branches: [ main ]
    paths:
      - 'Alpha/**'
      - 'Beta/**'
      - 'Release/**'
      - 'release.json'

# Cancel any in-progress run for the same branch so rapid commits don't race
# to create or edit the same release tag simultaneously.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release stage and assets
        id: resolve
        shell: bash
        run: |
          # Priority: Release > Beta > Alpha -- first folder that exists with a numeric build wins
          STAGE=""
          ASSET_DIR=""
          BUILD=""

          for CANDIDATE in Release Beta Alpha; do
            if [ -d "$CANDIDATE" ]; then
              HIGHEST=$(find "$CANDIDATE" -maxdepth 1 -mindepth 1 -type d \
                | grep -E '/[0-9]+$' | sort -t/ -k2 -V | tail -1)
              if [ -n "$HIGHEST" ]; then
                STAGE=$(echo "$CANDIDATE" | tr '[:upper:]' '[:lower:]')
                ASSET_DIR="$HIGHEST"
                BUILD=$(basename "$HIGHEST")
                break
              fi
            fi
          done

          if [ -z "$STAGE" ]; then
            echo "ERROR: No release stage folder (Alpha/Beta/Release) with a numeric build found."
            exit 1
          fi

          VERSION=$(jq -r '.version' release.json)
          DESCRIPTION=$(jq -r '.description' release.json)

          echo "stage=$STAGE"         >> "$GITHUB_OUTPUT"
          echo "asset_dir=$ASSET_DIR" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"        >> "$GITHUB_OUTPUT"

          # Use RUNNER_TEMP (guaranteed writable, cleaned up by runner) rather than /tmp
          printf '%s' "$DESCRIPTION" > "$RUNNER_TEMP/release_description.txt"

          echo "Resolved: stage=$STAGE  build=$BUILD  version=$VERSION  assets=$ASSET_DIR"

      - name: Build release notes
        id: notes
        shell: bash
        env:
          STAGE: ${{ steps.resolve.outputs.stage }}
          VERSION: ${{ steps.resolve.outputs.version }}
          BUILD: ${{ steps.resolve.outputs.build }}
        run: |
          DESCRIPTION=$(cat "$RUNNER_TEMP/release_description.txt")
          {
            echo "**Stage:** $STAGE"
            echo "**Version:** $VERSION"
            echo "**Build:** $BUILD"
            echo ""
            echo "$DESCRIPTION"
          } > "$RUNNER_TEMP/release_notes.txt"

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
          STAGE: ${{ steps.resolve.outputs.stage }}
          BUILD: ${{ steps.resolve.outputs.build }}
          ASSET_DIR: ${{ steps.resolve.outputs.asset_dir }}
        run: |
          TITLE="BalanceNudge $VERSION (Build $BUILD)"

          mapfile -t ASSETS < <(find "$ASSET_DIR" -maxdepth 1 -type f)

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "WARNING: No asset files found in $ASSET_DIR -- release will have no attachments."
          fi

          # Use an array so empty flags never produce a bare empty-string argument
          PRERELEASE_FLAGS=("--prerelease")
          if [ "$STAGE" = "release" ]; then
            PRERELEASE_FLAGS=("--no-prerelease")
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Tag $TAG already exists -- updating release and re-uploading assets."
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release_notes.txt" \
              "${PRERELEASE_FLAGS[@]}"

            if [ ${#ASSETS[@]} -gt 0 ]; then
              gh release upload "$TAG" "${ASSETS[@]}" --clobber
            fi
          else
            echo "Creating new release $TAG."
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release_notes.txt" \
              "${PRERELEASE_FLAGS[@]}" \
              "${ASSETS[@]}"
          fi

          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/$TAG"
